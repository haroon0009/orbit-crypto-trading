services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d crypto_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
